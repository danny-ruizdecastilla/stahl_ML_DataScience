    <html lang="en">

        <style>
            :root {
                --bg: #0f172a; /* slate-900 */
                --card: #111827ee; /* gray-900 */
                --text: #ad0c0c; /* gray-200 */
                --muted: #94a3b8; /* slate-400 */
                --accent: #38bdf8; /* sky-400 */
            }
            html, body {
                height: 100%;
                margin: 0;
                background: radial-gradient(1200px 600px at 70% -10%, #060e19 0%, var(--bg) 50%);
                color: var(--text);
                font-family: ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, Helvetica;
            }
            .app {
                max-width: 1100px;
                margin: 24px auto;
                padding: 10px;
                background: var(--card);
                border-radius: 12px;
                box-shadow: 0 20px 60px rgba(0,0,0,.50);
                border: 1px solid rgba(148,163,184,0.18);
            }
            .header {
                display: flex; align-items: center; justify-content: space-between; gap: 12px;
            }
            .title {
                margin: 0; font-size: 20px; letter-spacing: .2px; font-weight: 650;
            }
            .sub { color: var(--muted); font-size: 12px; }
            .btn {
                appearance: none; 
                border: 1px solid rgba(148,163,184,.5); 
                background: transparent; 
                color: var(--text);
                padding: 8px 12px; 
                border-radius: 12px; 
                cursor: pointer; 
                font-weight: 600; 
                font-size: 12px; 
                letter-spacing: .2px;
            }
            .btn:hover { border-color: rgba(148,163,184,.45); }

            #graph {
                width: 100%; 
                height: 620px; 
                border-radius: 12px; 
                overflow: hidden; 
                position: relative;
                background: linear-gradient(180deg, rgba(4, 34, 76, 0.5), rgba(9, 44, 93, 0.5));
            }
            svg { width: 100%; height: 100%; display: block; }

            .tooltip {
                position: absolute; 
                pointer-events: none; 
                background: rgba(15,23,42,.92); 
                color: var(--text);
                border: 1px solid rgba(148,163,184,.25); 
                padding: 6px 8px; 
                border-radius: 10px; 
                font-size: 12px; 
                opacity: 0; 
                transform: translate(-50%,-140%);
                white-space: nowrap; 
                backdrop-filter: blur(6px);
            }
        </style>
    </head>

                .style('fill', '#555')
                .style('opacity', 0) 
                .text(d => d.label);

            link.on('mousemove', function(event, d) {
                d3.select(this).style('stroke-width', 3);
                tooltip.style('opacity', 1)
                    .html(`<strong>${d.label}</strong>`)
                    .style('left', (event.pageX + 10) + 'px')
                    .style('top', (event.pageY - 20) + 'px');
            })
            .on('mouseout', function() {
                d3.select(this).style('stroke-width', 1.5);
                tooltip.style('opacity', 0);
            });

            const node = g.selectAll('.node')
                .data(graphData.nodes)
                .enter().append('circle')
                .attr('class', 'node')
                .attr('r', 10)
                .attr('fill', d => d.color)
                .style('filter','url(#glow)')
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended))
                .on('mousemove', (event, d) => {
                    tooltip.style('opacity', 1)
                        .html(`<strong>${d.id}</strong><br/><span style="color:#94a3b8">${d.group}</span>`)
                        .style('left', (event.pageX + 10) + 'px')
                        .style('top', (event.pageY - 20) + 'px');
                })
                .on('mouseout', () => tooltip.style('opacity', 0));

            simulation.on("tick", () => {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node
                    .attr("cx", d => d.x)
                    .attr("cy", d => d.y);

                linkLabels
                    .attr("x", d => (d.source.x + d.target.x) / 2)
                    .attr("y", d => (d.source.y + d.target.y) / 2);
            });

            const zoom = d3.zoom().scaleExtent([0.2, 4]).on('zoom', (event) => {
                g.attr('transform', event.transform);
            });
            svg.call(zoom);

            function resize() {
                const { width, height } = container.getBoundingClientRect();
                svg.attr('viewBox', `${-width/2} ${-height/2} ${width} ${height}`);
                simulation.force('center', d3.forceCenter(0, 0)).alpha(0.2).restart();
            }
            window.addEventListener('resize', resize);
            resize();

            document.getElementById('shuffle').addEventListener('click', () => {
                graphData.nodes.forEach(n => { n.vx = (Math.random()-.5)*3; n.vy = (Math.random()-.5)*3; });
                simulation.alpha(0.6).restart();
            });
            document.getElementById('reset').addEventListener('click', () => {
                svg.transition().duration(350).call(zoom.transform, d3.zoomIdentity);
            });

            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x; d.fy = d.y;
            }
            function dragged(event, d) {
                d.fx = event.x; d.fy = event.y;
            }
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null; d.fy = null;
            }
        </script>
    </body>
    </html>
